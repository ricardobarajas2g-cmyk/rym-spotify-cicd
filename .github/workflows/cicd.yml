name: RYM Spotify - CI CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: CI - pytest y API
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Detectar versión del modelo
        id: model
        shell: bash
        run: echo "version=$(python scripts/model_version.py)" >> "$GITHUB_OUTPUT"
      - name: Instalar dependencias compatibles
        shell: bash
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install "scikit-learn==${{ steps.model.outputs.version }}"
      - name: Ejecutar pruebas con pytest
        run: python -m pytest -v

  image:
    name: Docker - construir y probar
    needs: [tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Configurar Python para comprobación HTTP
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Obtener versión del Champion
        id: model
        shell: bash
        run: echo "version=$(python scripts/model_version.py)" >> "$GITHUB_OUTPUT"
      - name: Construir imagen para comprobación
        shell: bash
        run: |
          docker build --build-arg "SKLEARN_VERSION=${{ steps.model.outputs.version }}" -t rym-spotify-api:ci .
      - name: Probar el contenedor y los endpoints
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name rym-ci-api -p 127.0.0.1:8001:8000 rym-spotify-api:ci
          trap 'docker logs rym-ci-api || true; docker rm -f rym-ci-api || true' EXIT
          for intento in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8001/health >/dev/null; then break; fi
            sleep 2
          done
          python scripts/probar_contenedor.py --url http://127.0.0.1:8001

  publish:
    name: CD - publicar GHCR
    needs: [image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Obtener versión del Champion
        id: model
        shell: bash
        run: echo "version=$(python scripts/model_version.py)" >> "$GITHUB_OUTPUT"
      - name: Preparar nombre de imagen en minúsculas
        id: image_name
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagen en GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SKLEARN_VERSION=${{ steps.model.outputs.version }}
            SOURCE_REPO=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.image_name.outputs.name }}:latest
            ${{ steps.image_name.outputs.name }}:${{ github.sha }}
